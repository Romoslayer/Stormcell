org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Mod
mod_id=stormcell
mod_name=Stormcell
mod_version=1.0.0
mod_author=Romoslayer
mod_description=Regional, moving weather for Minecraft servers: storms form, drift with the wind, strengthen and fade, so it can pour in one place while it stays clear somewhere else. Joining players do not need the mod.
license=PolyForm-Shield-1.0.0
group=dev.romoslayer.stormcell

# Loaders shared by every supported game version (per-version values are in versions/<mc>.properties)
fabric_loader_version=0.19.5
loom_version=1.17.21
# Minecraft 1.21.x and 1.20.x are obfuscated and need the older "fabric-loom" plugin, which remaps
loom_version_legacy=1.13.6
moddev_version=2.0.148
forgegradle_version=7.0.40
# Forge dev runs need the classes and resources in one folder to see them as one mod
net.minecraftforge.gradle.merge-source-sets=true
mixinextras_version=0.5.3
