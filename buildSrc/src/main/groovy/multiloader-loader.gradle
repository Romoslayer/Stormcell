plugins {
    id 'multiloader-common'
}

// The loader projects compile Common's sources and ship its resources themselves, so each jar is self-contained
evaluationDependsOn(':Common')
def common = project(':Common')

dependencies {
    compileOnly common
}

tasks.named('compileJava', JavaCompile) {
    source(common.sourceSets.main.allSource)
}

processResources {
    from(common.sourceSets.main.resources)
}

jar {
    // Names the loader the jar was built for. NeoForge for 1.20.x builds from the Forge sources, so without this its jar
    // would be identical to the Forge one (and CurseForge rejects identical files as duplicates).
    manifest {
        attributes 'Built-For-Loader': project.name
    }
}
