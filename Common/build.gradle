plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Plain Minecraft (no loader) so nothing loader-specific can creep into the shared code
neoForge {
    neoFormVersion = neoform_version
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // Fabric Loader and NeoForge both bundle MixinExtras
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
        content { includeGroupAndSubgroups('org.spongepowered') }
    }
}

// Unit tests for the parts that do not need a running game: config, saved state, and the weather simulation itself
// (driven through a made-up WeatherEnvironment)
dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// ModDevGradle only puts Minecraft on the main classpath; the tests need it too
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

// Long simulation runs (gradlew :Common:calibrate) and load benchmarks (gradlew :Common:benchmark), kept out of the
// normal test run because they take a while and print tables rather than pass/fail on fine details
tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'calibration', 'benchmark' }
}
['calibrate': 'calibration', 'benchmark': 'benchmark'].each { name, tag ->
    tasks.register(name, Test) {
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags tag }
        outputs.upToDateWhen { false }
        testLogging {
            events 'failed'
            exceptionFormat 'full'
            showStandardStreams = true
        }
    }
}
